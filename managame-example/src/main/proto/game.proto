// The game's messages. Each travels in a frame of the game's own format, under the id Protocol gives its type:
// | length int | message id int | seq int | code int | protobuf body |
syntax = "proto3";

package example;

option java_package = "cn.managame.example.proto";
option java_multiple_files = true;

// Client and game server

message LoginRequest {
  int64 player_id = 1;
  string name = 2;
}

message LoginResponse {
  string name = 1;
  int64 gold = 2;
}

message BuyRequest {
  int32 config_id = 1;
}

message BuyResponse {
  int32 config_id = 1;
  int64 gold = 2;
}

message BagRequest {}

message ItemStack {
  int32 config_id = 1;
  int32 amount = 2;
}

message BagResponse {
  repeated ItemStack items = 1;
}

message RankRequest {}

message RankResponse {
  int64 rank = 1;
  int64 ranked = 2;
}

// Game server and world server, over RPC

message RankQuery {
  int64 gold = 1;
}

message RankAnswer {
  int64 rank = 1;
  int64 ranked = 2;
}
